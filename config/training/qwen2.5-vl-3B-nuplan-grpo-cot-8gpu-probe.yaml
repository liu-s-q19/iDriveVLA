name: qwen2.5-vl-3B-nuplan-grpo-8gpu-probe
description: AutoVLA Qwen2.5-VL-3B GRPO probe run on navsim v1 with single-node 8 GPUs

model:
  use_cot: false
  pretrained_model_path: /data/ckpt/Qwen/Qwen2.5-VL-3B-Instruct
  sft_model_path: /data/hezeyu/AutoVLA/runs/sft/2026-03-06_12-12-48/epoch=4-loss=1.0341.ckpt
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  train_vision_backbone: false
  train_lm_backbone: true
  lora:
    use: true
    task_type: CAUSAL_LM
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    r: 8
    alpha: 8
    dropout: 0.1
    bias: "none"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

data:
  train:
    path: /data/dataset/navsim/placeholder/trainval
    scene_filter: /data/liushiqi/AutoVLA_main_rl_v1/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtrain.yaml
    metric_cache_path: /data/dataset/navsim/metric_cache/navtrain
    json_dataset_path: /data/dataset/navsim/preprocessed/navtrainval_nocot
    sensor_data_path: /data/dataset/navsim/sensor_blobs/trainval
  val:
    path: /data/dataset/navsim/placeholder/test
    scene_filter: /data/liushiqi/AutoVLA_main_rl_v1/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtest.yaml
    metric_cache_path: /data/dataset/navsim/metric_cache/navtest
    json_dataset_path: /data/dataset/navsim/preprocessed/navtest_nocot
    sensor_data_path: /data/dataset/navsim/sensor_blobs/test

training:
  batch_size: 1
  learning_rate: 0.00003
  epochs: 1
  max_steps: 3
  log_every_n_steps: 1
  num_workers: 0
  weight_decay: 0.01
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  sample:
    max_length: 2048
    temperature: 0.2
    top_k: 0.0
    top_p: 1.0

rl:
  kl_beta: 0.04
  reward:
    sliding_window_size: 100
    scale: 10
  cot_penalty:
    coef: 0.002
    center: 400.0
    weight: 0.3

inference:
  batch_size: 1
  num_workers: 0
  max_length: 2048
  sample:
    temperature: 0.2
    top_k: 0.0
    top_p: 1.0
