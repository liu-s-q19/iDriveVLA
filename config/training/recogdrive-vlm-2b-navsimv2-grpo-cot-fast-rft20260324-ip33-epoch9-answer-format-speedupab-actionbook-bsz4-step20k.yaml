name: recogdrive-vlm-2b-navsimv2-grpo-fast-rft20260324-ip33-epoch9-answer-format-speedupab-actionbook-bsz4-step20k
description: "RFT trial bsz4 step20k with answer-format actionbook; keep ddp_find_unused_parameters=true"

model:
  use_cot: false
  pretrained_model_path: /data/ckpt/ReCogDrive-VLM-2B
  prompt:
    force_action_answer_prefix: true
  action_answer_protocol:
    enabled: true
  sft_model_path: /data/liushiqi/AutoVLA/runs/sft/recogdrive_vlm2b_navsimv2_sft8_ip33_epoch10_speedupab_2026-03-23_05-48-12/epoch=9-loss=0.9375.ckpt
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  train_vision_backbone: false
  train_lm_backbone: true
  lora:
    use: true
    task_type: CAUSAL_LM
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    r: 8
    alpha: 8
    dropout: 0.1
    bias: "none"
  trajectory:
    num_poses: 8
    interval_length: 0.5
    time_horizon: 4.0
  tokens:
    action_start_id: 151682
    ignore_index: -100
    assistant_id: [151644, 77091, 198]
  video:
    min_pixels: 109760
    max_pixels: 109760
  internvl:
    image_size: 448

data:
  train:
    path: /data/dataset/navsim/placeholder/trainval
    scene_filter: /data/liushiqi/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtrain.yaml
    metric_cache_path: /data/dataset/navsim/metric_cache_v2/navtrain_full_2026-03-07_15-49-21
    json_dataset_path: /data/dataset/navsim/preprocessed/navtrainval_nocot
    sensor_data_path: /data/dataset/navsim
    max_samples: 12000
  val:
    path: /data/dataset/navsim/placeholder/test
    scene_filter: /data/liushiqi/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtest.yaml
    metric_cache_path: /data/dataset/navsim/metric_cache_v2/navtest_full_2026-03-07_15-40-49
    json_dataset_path: /data/dataset/navsim/preprocessed/navtest_nocot
    sensor_data_path: /data/dataset/navsim

training:
  batch_size: 4
  learning_rate: 0.00003
  epochs: 1
  max_steps: 20000
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  weight_decay: 0.01
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  distributed_strategy: ddp
  ddp_find_unused_parameters: true
  log_every_n_steps: 20
  checkpoint_every_n_train_steps: 2000
  enable_progress_bar: true
  progress_bar_refresh_rate: 10
  log_grouped_rewards: false
  empty_cache_each_step: false
  sample:
    max_length: 2048
    max_new_tokens: 256
    temperature: 1.0
    top_k: 0.0
    top_p: 1.0

rl:
  kl_beta: 0.04
  reward:
    type: epdms_stage1
    traffic_agents: non_reactive
    human_penalty_filter: true
    sliding_window_size: 100
    scale: 10
    reactive:
      target_velocity: 10
      min_gap_to_lead_agent: 1.0
      headway_time: 1.5
      accel_max: 1.0
      decel_max: 2.0
      open_loop_detections_types: []
      minimum_path_length: 20
      planned_trajectory_samples: null
      planned_trajectory_sample_interval: null
      radius: 100
      add_open_loop_parked_vehicles: true
      idm_snap_threshold: 3.0
      map_root_override: null
  advantage:
    group_std_eps: 1e-6
    fallback_mode: zero
  cot_penalty:
    coef: 0.002
    center: 400.0
    weight: 0.3

inference:
  batch_size: 4
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  max_length: 2048
  sample:
    max_new_tokens: 256
    temperature: 0.2
    top_k: 20
    top_p: 1.0
