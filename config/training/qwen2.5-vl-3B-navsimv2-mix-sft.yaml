name: qwen2.5-vl-3B-navsimv2-mix-sft
description: AutoVLA SFT on NavSim v2 trainval first; keep mix-SFT layout for later nuScenes mixing

# model
model:
  use_cot: false
  pretrained_model_path: /data/ckpt/Qwen/Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

# training
training:
  batch_size: 1
  num_nodes: 1
  devices: auto
  log_every_n_steps: 10
  enable_progress_bar: true
  progress_bar_refresh_rate: 10
  logging:
    type: tensorboard  # tensorboard | csv | both
  distributed_strategy: ddp
  ddp_find_unused_parameters: true
  gradient_checkpointing: false
  learning_rate: 2.0e-5
  action_loss_weight: 2.0
  cot_sample_loss_multiplier: 1.0
  generated_action_probe:
    enabled: true
    every_n_steps: 400
    max_new_tokens: 2048
    do_sample: true
    temperature: 1.0
    top_k: 0
    top_p: 1.0
  epochs: 5
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 4

data:
  train:
    json_dataset_path:
      - /data/dataset/navsim/preprocessed/navtrainval_nocot
    sensor_data_path:
      - /data/dataset/navsim
    # Keep mix-SFT extension slot for next stage (disabled now):
    # - /data/AutoVLA/nusc_drivelm_codeclean_train
    # - /data/dataset/nuscenes

  val:
    json_dataset_path: /data/dataset/navsim/preprocessed/navtest_nocot
    sensor_data_path: /data/dataset/navsim

inference:
  batch_size: 1
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  sample:
    max_length: 2048
    temperature: 0.2
    top_k: 20
    top_p: 1.0
