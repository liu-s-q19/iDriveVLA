name: qwen2.5-vl-3B-navsimv2-grpo
description: AutoVLA GRPO on NavSim v2 caches (train on navtrainval json + navtrain v2 metric cache)

model:
  use_cot: true
  pretrained_model_path: /data/ckpt/Qwen/Qwen2.5-VL-3B-Instruct
  prompt:
    force_action_answer_prefix: false
  sft_model_path: /data/liushiqi/AutoVLA/runs/sft/2026-03-08_14-15-17/epoch=4-loss=0.6140.ckpt
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  train_vision_backbone: false
  train_lm_backbone: true
  lora:
    use: true
    task_type: CAUSAL_LM
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    r: 8
    alpha: 8
    dropout: 0.1
    bias: "none"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

data:
  train:
    path: /data/dataset/navsim/placeholder/trainval
    scene_filter: /data/liushiqi/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtrain.yaml
    metric_cache_path: /data/dataset/navsim/metric_cache_v2/navtrain_full_2026-03-07_15-49-21
    json_dataset_path: /data/dataset/navsim/preprocessed/navtrainval_nocot
    sensor_data_path: /data/dataset/navsim
  val:
    path: /data/dataset/navsim/placeholder/test
    scene_filter: /data/liushiqi/navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtest.yaml
    metric_cache_path: /data/dataset/navsim/metric_cache_v2/navtest_full_2026-03-07_15-40-49
    json_dataset_path: /data/dataset/navsim/preprocessed/navtest_nocot
    sensor_data_path: /data/dataset/navsim

training:
  batch_size: 1
  learning_rate: 0.00003
  epochs: 1
  max_steps: 6000
  num_workers: 1
  weight_decay: 0.01
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  sample:
    max_length: 2048
    temperature: 1.0
    top_k: 0.0
    top_p: 1.0

rl:
  kl_beta: 0.04
  reward:
    type: epdms_stage1  # options: epdms_stage1 | epdms_full (placeholder, currently falls back to stage1)
    traffic_agents: non_reactive  # options: non_reactive | reactive
    human_penalty_filter: true
    sliding_window_size: 100
    scale: 10
    # default reactive policy config (used when traffic_agents=reactive)
    reactive:
      target_velocity: 10
      min_gap_to_lead_agent: 1.0
      headway_time: 1.5
      accel_max: 1.0
      decel_max: 2.0
      open_loop_detections_types: []
      minimum_path_length: 20
      planned_trajectory_samples: null
      planned_trajectory_sample_interval: null
      radius: 100
      add_open_loop_parked_vehicles: true
      idm_snap_threshold: 3.0
      map_root_override: null
  cot_penalty:
    coef: 0.002
    center: 400.0
    weight: 0.3

inference:
  batch_size: 1
  num_workers: 1
  max_length: 2048
  sample:
    temperature: 0.2
    top_k: 20
    top_p: 1.0
