upstream:
  navsim_root: /data/liushiqi/navsim
  config_dir: /data/liushiqi/navsim/navsim/planning/script/config/pdm_scoring
  config_name: default_run_pdm_score
  overrides:
    - train_test_split=navhard_two_stage
    - worker=sequential
    - navsim_log_path=/readOnly/df_l2.9/navsim/test_navsim_logs/test
    - original_sensor_path=/readOnly/df_l2.9/navsim/test_sensor_blobs/test
    - synthetic_sensor_path=/readOnly/df_l2.9/navsim/navhard_two_stage/sensor_blobs
    - synthetic_scenes_path=/readOnly/df_l2.9/navsim/navhard_two_stage/synthetic_scene_pickles
    - metric_cache_path=/data/dataset/navsim/metric_cache_v2/navhard_two_stage_full_2026-03-09_03-37-22_n733
    - scorer=pdm_scorer

model:
  config_path: /data/liushiqi/AutoVLA/config/training/recogdrive-vlm-2b-navsimv2-grpo-cot-fast-rft20260323-ip190-answer-format.yaml
  checkpoint_path: /tmp/rft_recogdrive_vlm2b_answer_format.ckpt
  sensor_data_path: /
  dataset_name: nuplan
  trajectory_sampling:
    num_poses: 8
    interval_length: 0.5
  lora_conf:
    use_lora: true
    task_type: CAUSAL_LM
    target_modules: [q_proj, v_proj, k_proj, o_proj]
    r: 8
    lora_alpha: 8
    lora_dropout: 0.1
    bias: none

traffic_agents:
  mode: reactive

eval:
  output_dir: /data/liushiqi/AutoVLA/logs/eval/navhard_two_stage_autovla_recogdrive_vlm2b_rft20260323_answer_format
  max_stage_one_scenarios: null
  max_stage_two_scenarios: null

debug:
  dump_scene_data_dir: null
  dump_max_items: 0
