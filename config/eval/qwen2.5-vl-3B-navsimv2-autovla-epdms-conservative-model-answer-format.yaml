name: qwen2.5-vl-3B-navsimv2-autovla-epdms-conservative-answer-format
description: Conservative decode config for standard navsim v2 EPDMS AutoVLA evaluation, answer-format

model:
  use_cot: false
  pretrained_model_path: /data/ckpt/Qwen/Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  action_answer_protocol:
    enabled: true
  trajectory:
    num_poses: 8
    interval_length: 0.5
    time_horizon: 4.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

inference:
  sample:
    max_new_tokens: 256
    temperature: 0.2
    top_k: 20
    top_p: 1.0
